apiVersion: v1
kind: Pod
metadata:
  name: quota-reject
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
  containers:
  - name: quota-reject
    image: python:3.11-slim
    resources:
      requests:
        cpu: "3"
        memory: 128Mi
      limits:
        cpu: "3"
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
